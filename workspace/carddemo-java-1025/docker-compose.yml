name: carddemo

services:
  postgres:
    image: postgres:16-alpine
    container_name: carddemo-postgres
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - carddemo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-service:
    build:
      context: ./services/iam-service
    container_name: carddemo-iam
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_iam
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      IAM_TOKEN_SECRET: ${IAM_TOKEN_SECRET:-carddemo-demo-secret-change-me}
      IAM_TOKEN_TTL_SECONDS: 3600
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./services/customer-service
    container_name: carddemo-customer
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_customer
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  card-service:
    build:
      context: ./services/card-service
    container_name: carddemo-card
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_card
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ./services/account-service
    container_name: carddemo-account
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_account
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: ./services/transaction-service
    container_name: carddemo-transaction
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_transaction
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      CARD_SERVICE_URL: http://card-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8084
      MARKETING_SERVICE_URL: http://marketing-service:8087
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      card-service:
        condition: service_started
      account-service:
        condition: service_started
      marketing-service:
        condition: service_started

  authorization-service:
    build:
      context: ./services/authorization-service
    container_name: carddemo-authorization
    environment:
      SERVER_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_authorization
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      CARD_SERVICE_URL: http://card-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8084
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      card-service:
        condition: service_started
      account-service:
        condition: service_started
      customer-service:
        condition: service_started

  ledger-service:
    build:
      context: ./services/ledger-service
    container_name: carddemo-ledger
    environment:
      SERVER_PORT: 8089
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_ledger
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy

  installment-service:
    build:
      context: ./services/installment-service
    container_name: carddemo-installment
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_installment
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      IAM_TOKEN_SECRET: ${IAM_TOKEN_SECRET:-carddemo-demo-secret-change-me}
      ACCOUNT_SERVICE_URL: http://account-service:8084
      TRANSACTION_SERVICE_URL: http://transaction-service:8085
      LEDGER_SERVICE_URL: http://ledger-service:8089
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      ledger-service:
        condition: service_started

  web-ui:
    build:
      context: ./services/web-ui
    container_name: carddemo-web-ui
    environment:
      SERVER_PORT: 8080
      IAM_SERVICE_URL: http://iam-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      CARD_SERVICE_URL: http://card-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8084
      TRANSACTION_SERVICE_URL: http://transaction-service:8085
      AUTHORIZATION_SERVICE_URL: http://authorization-service:8086
      MARKETING_SERVICE_URL: http://marketing-service:8087
      INSTALLMENT_SERVICE_URL: http://installment-service:8088
    ports:
      - "8090:8080"
    depends_on:
      iam-service:
        condition: service_started
      customer-service:
        condition: service_started
      card-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      authorization-service:
        condition: service_started
      marketing-service:
        condition: service_started
      installment-service:
        condition: service_started

  marketing-service:
    build:
      context: ./services/marketing-service
    container_name: carddemo-marketing
    environment:
      SERVER_PORT: 8087
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_marketing
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      ACCOUNT_SERVICE_URL: http://account-service:8084
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started

volumes:
  carddemo-pgdata:
