server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: web-ui
  web:
    resources:
      cache:
        period: 0

proxy:
  iam-service-url: ${IAM_SERVICE_URL:http://localhost:8081}
  customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  card-service-url: ${CARD_SERVICE_URL:http://localhost:8083}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8084}
  transaction-service-url: ${TRANSACTION_SERVICE_URL:http://localhost:8085}
  authorization-service-url: ${AUTHORIZATION_SERVICE_URL:http://localhost:8086}
  marketing-service-url: ${MARKETING_SERVICE_URL:http://localhost:8087}
  installment-service-url: ${INSTALLMENT_SERVICE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.carddemo: INFO
